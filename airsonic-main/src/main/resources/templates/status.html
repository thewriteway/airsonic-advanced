<!DOCTYPE html>
<html><head>
    <th:block th:replace="~{head :: common_head}" />
    <script type="text/javascript" th:src="@{/script/chart-4.5.1.min.js}"></script>
    <script type="text/javascript" th:src="@{/script/status.js}"></script>
    <meta http-equiv="CACHE-CONTROL" content="NO-CACHE">
    <style>
      .status-page { max-width: 1400px; }
      .status-page h2 { margin-top: 2em; }
      .status-toolbar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 0.5em 1.5em;
        align-items: center; justify-content: space-between; padding: 0.5em 0;
        border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
      .status-sections, .status-refresh { display: flex; flex-wrap: wrap; gap: 0.4em; align-items: center; }
      .status-sections button { background: none; border: none; padding: 0.2em 0.4em; cursor: pointer;
        color: var(--shell-link-color, inherit); font: inherit; }
      .status-sections button:hover { text-decoration: underline; }
      .status-error { color: #c0392b; }
      .status-message { display: block; margin: 0.75em 0; padding: 0.5em 0.75em; border-radius: 4px;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent); }
      .status-message[hidden] { display: none; }
      .status-banner { margin: 0.5em 0 1em; padding: 0.6em 0.9em; border-radius: 4px; color: #fff;
        background: #c0392b; }
      .status-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0.75em;
        margin-top: 1em; }
      .status-card { padding: 0.75em 1em; border-radius: 6px;
        border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        background: color-mix(in srgb, currentColor 4%, transparent); }
      .status-card-title { font-size: 0.85em; opacity: 0.75; }
      .status-card-value { font-size: 1.6em; margin: 0.15em 0; font-variant-numeric: tabular-nums; }
      .status-card-detail { font-size: 0.85em; opacity: 0.75; }
      .status-card-busy .status-card-value { animation: status-pulse 1.6s ease-in-out infinite; }
      @keyframes status-pulse { 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { .status-card-busy .status-card-value { animation: none; } }
      .status-table { width: 100%; }
      .status-table td { vertical-align: middle; }
      .status-number { font-variant-numeric: tabular-nums; white-space: nowrap; }
      .status-small { font-size: 0.85em; }
      .status-muted { opacity: 0.65; }
      .status-scroll { overflow-x: auto; }
      .status-path { max-width: 32em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .status-agent { max-width: 16em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .status-inactive { opacity: 0.6; }
      .status-empty { font-style: italic; opacity: 0.7; }
      .status-type { display: inline-block; padding: 0.05em 0.5em; border-radius: 1em; font-size: 0.85em;
        color: #000; }
      .status-type-stream { background: rgb(230, 170, 30); }
      /* badge colors keep a contrast of at least 4.5:1 with their text */
      .status-type-download { background: #b8294e; color: #fff; }
      .status-type-upload { background: #1d64a6; color: #fff; }
      .status-pill { display: inline-block; padding: 0.05em 0.6em; border-radius: 1em; font-size: 0.85em;
        color: #fff; background: #5f6b6c; margin-left: 0.3em; }
      .status-card-value .status-pill { font-size: 0.6em; margin-left: 0; }
      .status-pill-up { background: #1e7b43; }
      .status-pill-down { background: #c0392b; }
      .status-pill-out_of_service, .status-pill-warn { background: #9a5a00; }
      .status-bar { display: inline-block; width: 6em; height: 0.6em; margin-right: 0.5em; vertical-align: middle;
        border-radius: 0.3em; overflow: hidden; background: color-mix(in srgb, currentColor 15%, transparent); }
      .status-bar-fill { height: 100%; background: #27ae60; }
      .status-bar-fill.status-bar-warn { background: #d68910; }
      .status-bar-fill.status-bar-danger { background: #c0392b; }
      .status-card-alert .status-card-value { color: #c0392b; }
      .status-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1em 2em;
        align-items: start; }
      .status-kv .status-bar { display: block; width: 100%; margin-top: 0.3em; }
      .status-space { white-space: nowrap; }
      .status-logger { max-width: 14em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .status-log-message { overflow-wrap: anywhere; }
      .status-history-controls { display: flex; flex-wrap: wrap; gap: 0.5em 1.5em; align-items: center;
        margin-bottom: 0.5em; }
      .status-bitrate { white-space: nowrap; }
      .status-sparkline { vertical-align: middle; margin-left: 0.5em; }
      .status-overdue { color: #c0392b; }
      .status-chart { position: relative; width: 100%; max-width: 900px; }
      .status-link { background: none; border: none; padding: 0; margin-top: 0.5em; cursor: pointer;
        color: var(--shell-link-color, inherit); font: inherit; text-decoration: underline; }
      .status-details { display: grid; grid-template-columns: max-content 1fr; gap: 0.15em 1em; margin: 0.4em 0 0; }
      .status-details dt { opacity: 0.75; }
      .status-details dd { margin: 0; word-break: break-all; }
      .status-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75em; }
      .status-kv div { font-size: 0.85em; opacity: 0.75; }
      .status-kv strong { display: block; font-size: 1.3em; font-weight: normal; font-variant-numeric: tabular-nums; }
      @media (max-width: 700px) {
        .status-table th:nth-child(n+6), .status-table td:nth-child(n+6) { display: none; }
        .status-path { max-width: 12em; }
      }
    </style>
    <script type="text/javascript" th:inline="javascript">
      Page.define("status", page => StatusPage.mount(page, {
        admin: /*[[${admin}]]*/ false,
        locale: /*[[${#locale.toLanguageTag()}]]*/ 'en',
        csrf: {header: /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN', token: /*[[${_csrf.token}]]*/ ''},
        urls: {
          summary: /*[[@{/statistics/summary}]]*/ '',
          health: /*[[@{/actuator/health}]]*/ '',
          caches: /*[[@{/actuator/caches}]]*/ '',
          history: /*[[@{/statistics/history}]]*/ ''
        },
        messages: {
          'unknown': /*[[#{common.unknown}]]*/ '',
          'stream': /*[[#{status.stream}]]*/ '',
          'download': /*[[#{status.download}]]*/ '',
          'upload': /*[[#{status.upload}]]*/ '',
          'never': /*[[#{status.never}]]*/ '',
          'incalculable': /*[[#{status.incalculable}]]*/ '',
          'tasktype.RUN_ONCE': /*[[#{status.scheduledrunonce}]]*/ '',
          'tasktype.FIXED_DELAY': /*[[#{status.scheduledfixeddelay}]]*/ '',
          'tasktype.FIXED_RATE': /*[[#{status.scheduledfixedrate}]]*/ '',
          'scheduledcreated': /*[[#{status.scheduledcreated}]]*/ '',
          'scheduledfirstrun': /*[[#{status.scheduledfirstrun}]]*/ '',
          'details': /*[[#{status.details}]]*/ '',
          'cachehitratio': /*[[#{status.cachehitratio}]]*/ '',
          'cacheclear': /*[[#{status.cacheclear}]]*/ '',
          'cacheclearconfirm': /*[[#{status.cacheclearconfirm}]]*/ '',
          'cacheclearallconfirm': /*[[#{status.cacheclearallconfirm}]]*/ '',
          'cachecleared': /*[[#{status.cachecleared}]]*/ '',
          'cachesallcleared': /*[[#{status.cachesallcleared}]]*/ '',
          'cacheclearfailed': /*[[#{status.cacheclearfailed}]]*/ '',
          'lastupdated': /*[[#{status.lastupdated}]]*/ '',
          'updatefailed': /*[[#{status.updatefailed}]]*/ '',
          'pause': /*[[#{status.pause}]]*/ '',
          'resume': /*[[#{status.resume}]]*/ '',
          'paused': /*[[#{status.paused}]]*/ '',
          'idle': /*[[#{status.idle}]]*/ '',
          'finished': /*[[#{status.finished}]]*/ '',
          'progress': /*[[#{status.progress}]]*/ '',
          'overdue': /*[[#{status.overdue}]]*/ '',
          'taskrunning': /*[[#{status.taskrunning}]]*/ '',
          'taskfailed': /*[[#{status.taskfailed}]]*/ '',
          'streamed': /*[[#{status.streamed}]]*/ '',
          'downloaded': /*[[#{status.downloaded}]]*/ '',
          'uploaded': /*[[#{status.uploaded}]]*/ '',
          'showall': /*[[#{status.showall}]]*/ '',
          'showtop': /*[[#{status.showtop}]]*/ '',
          'card.health': /*[[#{status.health}]]*/ '',
          'card.streams': /*[[#{status.card.streams}]]*/ '',
          'card.transfersdetail': /*[[#{status.card.transfersdetail}]]*/ '',
          'card.sessions': /*[[#{status.sessions}]]*/ '',
          'card.sessionsdetail': /*[[#{status.card.sessionsdetail}]]*/ '',
          'card.uptime': /*[[#{status.card.uptime}]]*/ '',
          'card.library': /*[[#{status.card.library}]]*/ '',
          'card.lastscan': /*[[#{status.card.lastscan}]]*/ '',
          'library.songs': /*[[#{status.library.songs}]]*/ '',
          'library.detail': /*[[#{status.library.detail}]]*/ '',
          'scanning': /*[[#{status.scanning}]]*/ '',
          'scanningdetail': /*[[#{status.scanningdetail}]]*/ '',
          'notscanned': /*[[#{status.notscanned}]]*/ '',
          'healthup': /*[[#{status.healthup}]]*/ '',
          'healthdown': /*[[#{status.healthdown}]]*/ '',
          'healthunknown': /*[[#{status.healthunknown}]]*/ '',
          'historysince': /*[[#{status.historysince}]]*/ '',
          'historypending': /*[[#{status.historypending}]]*/ '',
          'version': /*[[#{status.version}]]*/ '',
          'build': /*[[#{status.build}]]*/ '',
          'java': /*[[#{status.java}]]*/ '',
          'os': /*[[#{status.os}]]*/ '',
          'server': /*[[#{status.server}]]*/ '',
          'database': /*[[#{status.database}]]*/ '',
          'startedat': /*[[#{status.startedat}]]*/ '',
          'memory': /*[[#{status.memory}]]*/ '',
          'memoryused': /*[[#{status.memoryused}]]*/ '',
          'cpuairsonic': /*[[#{status.cpuairsonic}]]*/ '',
          'cpusystem': /*[[#{status.cpusystem}]]*/ '',
          'processors': /*[[#{status.processors}]]*/ '',
          'threads': /*[[#{status.threads}]]*/ '',
          'home': /*[[#{status.home}]]*/ '',
          'free': /*[[#{status.free}]]*/ '',
          'freeof': /*[[#{status.freeof}]]*/ '',
          'ok': /*[[#{status.ok}]]*/ '',
          'missing': /*[[#{status.missing}]]*/ '',
          'disabled': /*[[#{status.disabled}]]*/ '',
          'enabled': /*[[#{status.enabled}]]*/ '',
          'running': /*[[#{status.running}]]*/ '',
          'stopped': /*[[#{status.stopped}]]*/ '',
          'upnp': /*[[#{status.upnp}]]*/ '',
          'dlna': /*[[#{status.dlna}]]*/ '',
          'sonos': /*[[#{status.sonos}]]*/ '',
          'upnpport': /*[[#{status.upnpport}]]*/ '',
          'transcoder': /*[[#{status.transcoder}]]*/ '',
          'notfound': /*[[#{status.notfound}]]*/ '',
          'activeplayers': /*[[#{status.activeplayers}]]*/ '',
          'logsummary': /*[[#{status.logsummary}]]*/ '',
          'logunreadable': /*[[#{status.logunreadable}]]*/ '',
          'card.log': /*[[#{status.card.log}]]*/ '',
          'card.logdetail': /*[[#{status.card.logdetail}]]*/ ''
        }
      }));
    </script>
</head>
<body class="mainframe bgcolor1" data-page="status">
<div id="statusPage" class="status-page" aria-busy="true">

<h1>
    <img th:src="${themes?.get('statusImage') ?: 'icons/default_light/status.svg'}" alt="">
    <span style="vertical-align: middle" th:text="#{status.title}"></span>
</h1>

<div class="status-toolbar bgcolor1">
    <nav class="status-sections" th:aria-label="#{status.sections}">
        <button type="button" data-section="status-overview" th:text="#{status.overview}"></button>
        <button type="button" data-section="status-transfers" th:text="#{status.currenttransfers}"></button>
        <button type="button" data-section="status-users" th:text="#{status.usertransfers}"></button>
        <button type="button" data-section="status-history" th:text="#{status.history}"></button>
        <th:block th:if="${admin}">
            <button type="button" data-section="status-health" th:text="#{status.health}"></button>
            <button type="button" data-section="status-system" th:text="#{status.system}"></button>
            <button type="button" data-section="status-storage" th:text="#{status.storage}"></button>
            <button type="button" data-section="status-services" th:text="#{status.services}"></button>
            <button type="button" data-section="status-log" th:text="#{status.log}"></button>
            <button type="button" data-section="status-caches" th:text="#{status.caches}"></button>
            <button type="button" data-section="status-tasks" th:text="#{status.scheduledtasks}"></button>
            <button type="button" data-section="status-sessions" th:text="#{status.sessions}"></button>
            <button type="button" data-section="status-pathwatchers" th:text="#{status.pathwatcher}"></button>
        </th:block>
    </nav>
    <div class="status-refresh">
        <span id="statusUpdated" class="status-small" aria-live="polite"></span>
        <label class="status-small"><span th:text="#{status.refreshinterval}"></span>
            <select id="statusInterval"></select></label>
        <button type="button" id="statusPause" aria-pressed="false" th:text="#{status.pause}"></button>
        <button type="button" id="statusRefresh" th:text="#{common.refresh}"></button>
    </div>
</div>

<output id="statusMessage" class="status-message" aria-live="polite" hidden></output>

<section id="status-overview">
    <div id="statusCards" class="status-cards"></div>
</section>

<section id="status-transfers">
    <h2 th:text="#{status.currenttransfers}"></h2>
    <div class="status-scroll"><table id="statusTransfers" class="ruleTable indent status-table" hidden>
        <thead>
        <tr>
            <th scope="col" class="ruleTableHeader" th:text="#{status.type}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.user}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.player}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.current}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.progress}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.transmitted}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.bitratenow}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.started}"></th>
        </tr>
        </thead>
        <tbody></tbody>
    </table></div>
    <p id="statusTransfersEmpty" class="status-empty" th:text="#{status.notransfers}" hidden></p>
</section>

<section id="status-users">
    <h2 th:text="#{status.usertransfers}"></h2>
    <div id="statusUsersChartBox" class="status-chart" hidden><canvas id="statusUsersChart"></canvas></div>
    <button type="button" id="statusUsersToggle" class="status-link" hidden></button>
    <p id="statusUsersEmpty" class="status-empty" th:text="#{status.nousertransfers}" hidden></p>
</section>

<section id="status-history">
    <h2 th:text="#{status.history}"></h2>
    <div class="status-history-controls">
        <label class="status-small"><span th:text="#{status.historyperiod}"></span>
            <select id="statusHistoryDays"></select></label>
        <span id="statusHistoryNote" class="status-small status-muted"></span>
    </div>
    <div class="status-chart" style="height: 280px"><canvas id="statusHistoryChart"></canvas></div>
</section>

<th:block th:if="${admin}">
<section id="status-health">
    <h2 th:text="#{status.health}"></h2>
    <div id="statusHealthBanner" class="status-banner" role="alert" hidden></div>
    <div class="status-scroll"><table id="statusHealth" class="ruleTable indent status-table">
        <thead>
        <tr>
            <th scope="col" class="ruleTableHeader" th:text="#{status.component}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.status}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.details}"></th>
        </tr>
        </thead>
        <tbody></tbody>
    </table></div>
</section>

<section id="status-system">
    <h2 th:text="#{status.system}"></h2>
    <div class="status-columns">
        <dl id="statusSystemInfo" class="status-details"></dl>
        <div id="statusSystemMeters" class="status-kv"></div>
    </div>
</section>

<section id="status-storage">
    <h2 th:text="#{status.storage}"></h2>
    <div class="status-scroll"><table id="statusStorage" class="ruleTable indent status-table">
        <thead>
        <tr>
            <th scope="col" class="ruleTableHeader" th:text="#{status.name}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.path}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.status}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.free}"></th>
        </tr>
        </thead>
        <tbody></tbody>
    </table></div>
</section>

<section id="status-services">
    <h2 th:text="#{status.services}"></h2>
    <dl id="statusServices" class="status-details"></dl>
</section>

<section id="status-log">
    <h2 th:text="#{status.log}"></h2>
    <p id="statusLogSummary" class="status-small status-muted"></p>
    <div class="status-scroll"><table id="statusLog" class="ruleTable indent status-table" hidden>
        <thead>
        <tr>
            <th scope="col" class="ruleTableHeader" th:text="#{status.time}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.level}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.logger}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.message}"></th>
        </tr>
        </thead>
        <tbody></tbody>
    </table></div>
    <p id="statusLogEmpty" class="status-empty" th:text="#{status.lognone}" hidden></p>
</section>

<section id="status-caches">
    <h2 th:text="#{status.caches}"></h2>
    <button type="button" id="statusCachesClearAll" th:text="#{status.cacheclearall}"></button>
    <div class="status-scroll"><table id="statusCaches" class="ruleTable indent status-table" hidden>
        <thead>
        <tr>
            <th scope="col" class="ruleTableHeader" th:text="#{status.cachename}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.cachehitratio}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.cachehits}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.cachemiss}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.cacheputs}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.cacheremovals}"></th>
            <th scope="col" class="ruleTableHeader"><span class="status-muted" th:text="#{status.cacheclear}"></span></th>
        </tr>
        </thead>
        <tbody></tbody>
    </table></div>
    <p id="statusCachesEmpty" class="status-empty" th:text="#{status.nodata}" hidden></p>
</section>

<section id="status-tasks">
    <h2 th:text="#{status.scheduledtasks}"></h2>
    <div class="status-scroll"><table id="statusTasks" class="ruleTable indent status-table" hidden>
        <thead>
        <tr>
            <th scope="col" class="ruleTableHeader" th:text="#{status.name}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.scheduledtype}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.scheduledlastrun}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.schedulednextrun}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.scheduledby}"></th>
        </tr>
        </thead>
        <tbody></tbody>
    </table></div>
    <p id="statusTasksEmpty" class="status-empty" th:text="#{status.nodata}" hidden></p>
</section>

<section id="status-sessions">
    <h2 th:text="#{status.sessions}"></h2>
    <div class="status-kv">
        <div><span th:text="#{status.sessionscurrent}"></span><strong id="statusSessions-current">–</strong></div>
        <div><span th:text="#{status.sessionscreated}"></span><strong id="statusSessions-created">–</strong></div>
        <div><span th:text="#{status.sessionsexpired}"></span><strong id="statusSessions-expired">–</strong></div>
        <div><span th:text="#{status.sessionsrejected}"></span><strong id="statusSessions-rejected">–</strong></div>
    </div>
</section>

<section id="status-pathwatchers">
    <h2 th:text="#{status.pathwatcher}"></h2>
    <div class="status-scroll"><table id="statusPathWatchers" class="ruleTable indent status-table" hidden>
        <thead>
        <tr>
            <th scope="col" class="ruleTableHeader" th:text="#{status.name}"></th>
            <th scope="col" class="ruleTableHeader" th:text="#{status.path}"></th>
        </tr>
        </thead>
        <tbody></tbody>
    </table></div>
    <p id="statusPathWatchersEmpty" class="status-empty" th:text="#{status.nodata}" hidden></p>
</section>
</th:block>

</div>
</body></html>
