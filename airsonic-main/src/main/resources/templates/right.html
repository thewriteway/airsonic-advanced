<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script type="text/javascript" th:inline="javascript">
        (function () {
            function scanningStatus(scanInfo) {
                $("#scanCount").text(scanInfo.count);
                $("#scanningStatus").toggle(scanInfo.scanning);
            }
            function updateTableVisibility(table) {
                $('#right' + table).toggle($('#right' + table + 'Table').find('tr').length > 0);
            }

            Page.define("right", function (page) {
                var nowPlayingStatusUrl = /*[[@{/nowPlaying/status}]]*/ "/nowPlaying/status";
                var showNowPlaying = /*[[${model.showNowPlaying}]]*/ false;
                // status updates are applied one at a time, in the order they arrive
                var pending = Promise.resolve();

                function enqueue(task) {
                    pending = pending.then(function () {
                        return page.destroyed ? null : task();
                    }).catch(e => console.log("Could not update now playing", e));
                    return pending;
                }

                function populate(statuses, table) {
                    enqueue(() => {
                        $('#right' + table + 'Table').empty();
                        updateTableVisibility(table);
                    });
                    statuses.forEach(status => enqueue(() => addStatus(status, table)));
                }

                async function addStatus(status, table) {
                    const tableRoot = document.getElementById('right' + table + 'Table');
                    if (!tableRoot) {
                        return;
                    }
                    const res = await fetch(nowPlayingStatusUrl + "?id=" + status.transferId, { credentials: 'same-origin' });
                    if (!res.ok) {
                        return;
                    }
                    const tpl = document.createElement('template');
                    tpl.innerHTML = (await res.text()).trim();

                    tableRoot.querySelectorAll('.playstatus-' + status.transferId).forEach(el => el.remove());
                    tableRoot.append(tpl.content);
                    updateTableVisibility(table);
                }

                function removeStatus(status, table) {
                    const tableRoot = document.getElementById('right' + table + 'Table');
                    if (!tableRoot) {
                        return;
                    }
                    tableRoot.querySelectorAll('.playstatus-' + status.transferId + '.mediafile-' + status.mediaFileId).forEach(el => el.remove());
                    updateTableVisibility(table);
                }

                var sub = {
                    // no need to populate initial because the updates will occur frequently enough and are self-sufficient
                    '/topic/scanStatus': msg => scanningStatus(JSON.parse(msg.body))
                };
                if (showNowPlaying) {
                    Object.assign(sub, {
                        '/topic/nowPlaying/current/add': msg => enqueue(() => addStatus(JSON.parse(msg.body), 'NowPlaying')),
                        '/topic/nowPlaying/current/remove': msg => enqueue(() => removeStatus(JSON.parse(msg.body), 'NowPlaying')),
                        '/topic/nowPlaying/recent/add': msg => enqueue(() => addStatus(JSON.parse(msg.body), 'RecentlyPlayed')),
                        '/topic/nowPlaying/recent/remove': msg => enqueue(() => removeStatus(JSON.parse(msg.body), 'RecentlyPlayed')),
                        // Add existing (initial population, one time)
                        '/app/nowPlaying/current': msg => populate(JSON.parse(msg.body), 'NowPlaying'),
                        '/app/nowPlaying/recent': msg => populate(JSON.parse(msg.body), 'RecentlyPlayed')
                    });
                }
                page.subscribe(sub);
            });
        })();
    </script>
</head>
<body class="bgcolor1 rightframe" style="padding-top:2em" data-page="right">

    <div th:if="${model.newVersionAvailable}" class="warning" style="padding-bottom: 1em"
        th:utext="#{top.upgrade(${model.brand}, ${model.latestVersion}, ${model.latestVersion.url})}">
    </div>

    <div id="scanningStatus" style="display: none;" class="warning">
        <img th:src="${themes?.get('scanningImage') ?: 'icons/default_light/spinner.gif'}" title="" alt=""> <span th:text="#{main.scanning}"></span> <span id="scanCount"></span>
    </div>

    <div id="rightNowPlaying" style='display:none'>
        <h2 th:text="#{main.nowplaying}"></h2>
        <table id="rightNowPlayingTable" role="presentation" style='width:100%'></table>
    </div>

    <div id="rightRecentlyPlayed" style='display:none'>
        <h2 th:text="#{main.recentlyplayed}"></h2>
        <table id="rightRecentlyPlayedTable" role="presentation" style='width:100%'></table>
    </div>

</body>
</html>
