<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
    <th:block th:replace="~{head :: common_head}" />
    <th:block th:replace="~{websocket}" />
    <th:block th:replace="~{playQueue::head}"/>
    <link rel="alternate" type="application/rss+xml" title="Airsonic Podcast" th:href="@{/podcast.view(suffix=.rss)}">
    <link rel="stylesheet" th:href="@{/style/shell.css}" type="text/css">
    <script type="text/javascript" th:inline="javascript">
        var ShellConfig = {
            base: /*[[@{/}]]*/ "/",
            pages: /*[[${model.shellPages}]]*/ []
        };
        // only ever shown in their own regions, never in main
        ShellConfig.pages.push("left", "right");
    </script>
    <script type="text/javascript" th:src="@{/script/shell.js}"></script>
    <script type="text/javascript" th:src="@{/script/mediadrag.js}"></script>
</head>

<!--
  Regions: the top bar, the left navigation, the main page, the side panel (play queue and, when
  enabled, the activity of the "right" region) and the player bar along the bottom.
-->
<body class="bgcolor2 shell" th:classappend="${!model.showSideBar ? 'shell-sidebar-hidden' : ''}">
    <header class="shell-upper bgcolor2 topframe" data-shell-region="upper" data-page="top">
        <div class="shell-content" th:insert="~{top :: region}"></div>
    </header>

    <nav id="shell-left" class="shell-left bgcolor2" data-shell-region="left" th:data-shell-src="@{/left}">
        <div class="shell-content"></div>
    </nav>

    <main class="shell-main bgcolor1" data-shell-region="main" th:data-shell-src="@{/} + ${model.mainUrl}">
        <div class="shell-content"></div>
    </main>

    <div class="playqueue-container" th:replace="~{playQueue::container}"></div>

    <div class="shell-backdrop" data-on-click="closeDrawer"></div>

    <!-- not named "hidden": a named iframe shadows the document property of that name (document.hidden) -->
    <iframe id="shell-hidden" name="shell-hidden" title="" hidden></iframe>
</body>
</html>
