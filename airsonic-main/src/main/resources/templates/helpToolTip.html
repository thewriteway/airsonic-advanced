
<!--
  Shows online help in a popover.

PARAMETERS
  topic: Refers to a key in the resource bundle containing the text to display in the popover.
-->

<button type="button" class="icon-button help-button" th:popovertarget="|help-${topic}|" th:title="#{common.help}">
    <img th:src="@{|/${themes?.get('helpPopupImage') ?: 'icons/default_light/help.svg'}|}" th:alt="#{common.help}"/>
</button>
<div th:id="|help-${topic}|" class="help-popover" popover>
    <div style="font-weight:bold;" th:text="#{helppopup.__${topic}__.title(${'Airsonic'})}"></div>
    <div th:utext="#{helppopup.__${topic}__.text(${'Airsonic'})}"></div>
</div>
