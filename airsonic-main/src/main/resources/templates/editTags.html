<!DOCTYPE html>
<html><head>
    <th:block th:replace="~{head :: common_head}" />
    <th:block th:replace="~{jquery}" />
<script type="text/javascript" th:inline="javascript">
    Page.define("editTags", function (page) {
        var index = 0;
        var fileCount = /*[[${#lists.size(command.songs)}]]*/ 0;
        var messages = {
            working: /*[[#{edittags.working}]]*/ "",
            skipped: /*[[#{edittags.skipped}]]*/ "",
            updated: /*[[#{edittags.updated}]]*/ "",
            error: /*[[#{edittags.error}]]*/ ""
        };

        /** Copies the value of the "all" field to the field of every song. */
        function setAll(field, sourceSelector) {
            var value = $(sourceSelector).val();
            for (var i = 0; i < fileCount; i++) {
                $("input[name='" + field + i + "']").val(value);
            }
        }

        /** Copies hidden per-song values (suggested or original) to a field of every song. */
        function copyField(source, field) {
            for (var i = 0; i < fileCount; i++) {
                $("input[name='" + field + i + "']").val($("input[name='" + source + i + "']").val());
            }
        }

        function updateNextTag() {
            var id = $("input[name='id" + index + "']").val();
            var artist = $("input[name='artist" + index + "']").val();
            var track = $("input[name='track" + index + "']").val();
            var album = $("input[name='album" + index + "']").val();
            var title = $("input[name='title" + index + "']").val();
            var year = $("input[name='year" + index + "']").val();
            var genre = $("input[name='genre" + index + "']").val();
            $("#status" + index).text(messages.working);
            StompClient.send("/app/tags/edit", JSON.stringify({mediaFileId: id, artist: artist, track: track, album: album, title: title, year: year, genre: genre}));
        }

        function setTagsCallback(result) {
            var status = $("#status" + index).empty();
            if (result == "SKIPPED") {
                status.text(messages.skipped);
            } else if (result == "UPDATED") {
                status.append($("<b>").text(messages.updated));
            } else {
                status.append($("<div class='warning'>").text(messages.error));
                $("#errors").append($("<br>"), document.createTextNode(result), $("<br>"));
            }
            index++;
            if (index < fileCount) {
                updateNextTag();
            } else {
                document.getElementById("save").disabled = false;
            }
        }

        page.actions({
            setArtist: () => setAll("artist", "input[name='artistAll']"),
            setAlbum: () => setAll("album", "input[name='albumAll']"),
            setYear: () => setAll("year", "input[name='yearAll']"),
            setGenre: () => setAll("genre", "select[name='genreAll']"),
            suggestTitle: () => copyField("suggestedTitle", "title"),
            resetTitle: () => copyField("originalTitle", "title"),
            suggestTrack: () => copyField("suggestedTrack", "track"),
            resetTrack: () => copyField("originalTrack", "track"),
            /** Enter in an "all" field applies it (data-set names the action). */
            setOnEnter(input, event) {
                if (event.key == "Enter") {
                    page.run(input.dataset.set);
                    return false;
                }
            },
            updateTags() {
                document.getElementById("save").disabled = true;
                index = 0;
                $("#errors").empty();
                for (var i = 0; i < fileCount; i++) {
                    $("#status" + i).empty();
                }
                updateNextTag();
            }
        });

        page.subscribe({
            "/user/queue/tags/edit": msg => setTagsCallback(msg.body)
        });
    });
</script>
</head>
<body class="mainframe bgcolor1" data-page="editTags">
<h1 th:text="#{edittags.title}"></h1>
<div class="back"><a th:href="@{/main.view(id=${command.id})}" th:text="#{common.back}"></a></div>

<table class="ruleTable indent">
    <tr>
        <th class="ruleTableHeader" th:text="#{edittags.file}"></th>
        <th class="ruleTableHeader" th:text="#{edittags.track}"></th>
        <th class="ruleTableHeader" th:text="#{edittags.songtitle}"></th>
        <th class="ruleTableHeader" th:text="#{edittags.artist}"></th>
        <th class="ruleTableHeader" th:text="#{edittags.album}"></th>
        <th class="ruleTableHeader" th:text="#{edittags.year}"></th>
        <th class="ruleTableHeader" th:text="#{edittags.genre}"></th>
        <th class="ruleTableHeader" width="60pt" th:text="#{edittags.status}"></th>
    </tr>
    <tr>
        <th class="ruleTableHeader" scope="col"></th>
        <th class="ruleTableHeader" scope="col"><a href="#" data-on-click="suggestTrack" th:text="#{edittags.suggest.short}"></a> |
            <a href="#" data-on-click="resetTrack" th:text="#{edittags.reset.short}"></a></th>
        <th class="ruleTableHeader" scope="col"><a href="#" data-on-click="suggestTitle" th:text="#{edittags.suggest}"></a> |
            <a href="#" data-on-click="resetTitle" th:text="#{edittags.reset}"></a></th>
        <th class="ruleTableHeader" scope="col" style="white-space: nowrap">
            <label for="artistAll" class="visually-hidden" th:text="#{edittags.artist}"></label>
            <input type="text" id="artistAll" name="artistAll" data-on-keydown="setOnEnter" data-set="setArtist" size="15" th:value="${command.defaultArtist}"/>&nbsp;<a href="#" data-on-click="setArtist" th:text="#{edittags.set}"></a></th>
        <th class="ruleTableHeader" scope="col" style="white-space: nowrap">
            <label for="albumAll" class="visually-hidden" th:text="#{edittags.album}"></label>
            <input type="text" id="albumAll" name="albumAll" data-on-keydown="setOnEnter" data-set="setAlbum" size="15" th:value="${command.defaultAlbum}"/>&nbsp;<a href="#" data-on-click="setAlbum" th:text="#{edittags.set}"></a></th>
        <th class="ruleTableHeader" scope="col" style="white-space: nowrap">
            <label for="yearAll" class="visually-hidden" th:text="#{edittags.year}"></label>
            <input type="text" id="yearAll" name="yearAll" data-on-keydown="setOnEnter" data-set="setYear" size="5" th:value="${command.defaultYear}"/>&nbsp;<a href="#" data-on-click="setYear" th:text="#{edittags.set}"></a></th>
        <th class="ruleTableHeader" scope="col" style="white-space: nowrap">
            <label for="genreAll" class="visually-hidden" th:text="#{edittags.genre}"></label>
            <select id="genreAll" name="genreAll" style="width:7em">
                <option value=""/>
                <option th:each="genre:${command.allGenres}" th:selected="${genre eq command.defaultGenre}" th:value="${genre}" th:text="${genre}"></option>
            </select>

            <a href="#" data-on-click="setGenre" th:text="#{edittags.set}"></a>
        </th>
        <th class="ruleTableHeader"></th>
    </tr>

    <tr th:each="song,loopStatus:${command.songs}">
        <input type="hidden" th:name="|id${loopStatus.index}|" th:value="${song.id}"/>
        <input type="hidden" th:name="|suggestedTitle${loopStatus.index}|" th:value="${song.suggestedTitle}"/>
        <input type="hidden" th:name="|originalTitle${loopStatus.index}|" th:value="${song.title}"/>
        <input type="hidden" th:name="|suggestedTrack${loopStatus.index}|" th:value="${song.suggestedTrack}"/>
        <input type="hidden" th:name="|originalTrack${loopStatus.index}|" th:value="${song.track}"/>
        <td class="ruleTableCell" th:title="|${song.fileName}|" th:text="${#strings.abbreviate(song.fileName,30)}"></td>
        <td class="ruleTableCell"><input type="text" size="5" th:name="|track${loopStatus.index}|" th:value="${song.track}"/></td>
        <td class="ruleTableCell"><input type="text" size="30" th:name="|title${loopStatus.index}|" th:value="${song.title}"/></td>
        <td class="ruleTableCell"><input type="text" size="15" th:name="|artist${loopStatus.index}|" th:value="${song.artist}"/></td>
        <td class="ruleTableCell"><input type="text" size="15" th:name="|album${loopStatus.index}|" th:value="${song.album}"/></td>
        <td class="ruleTableCell"><input type="text" size="5"  th:name="|year${loopStatus.index}|" th:value="${song.year}"/></td>
        <td class="ruleTableCell"><input type="text" th:name="|genre${loopStatus.index}|" th:value="${song.genre}" style="width:7em"/></td>
        <td class="ruleTableCell"><div th:id="|status${loopStatus.index}|"></div></td>
    </tr>

</table>

<p><input type="submit" id="save" th:value="#{common.save}" data-on-click="updateTags"/></p>
<div class="warning" id="errors"></div>
</body></html>
