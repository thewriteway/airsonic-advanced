<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="region">
    <script type="text/javascript" th:inline="javascript">
        Page.define("top", function (page) {
            var showSideBar = /*[[${model.showSideBar}]]*/ false;
            var previousQuery = "";
            var instantSearchTimeout = null;
            var connectionImages = {
                connected: /*[[${themes?.get('connectedImage') ?: 'icons/default_light/connected.svg'}]]*/ "icons/default_light/connected.svg",
                disconnected: /*[[${themes?.get('disconnectedImage') ?: 'icons/default_light/disconnected.svg'}]]*/ "icons/default_light/disconnected.svg",
                connecting: /*[[${themes?.get('connectingImage') ?: 'icons/default_light/cloudwait.svg'}]]*/ "icons/default_light/cloudwait.svg"
            };
            var connectionTexts = {
                connected: /*[[#{top.connected}]]*/ "Connected",
                disconnected: /*[[#{top.disconnected}]]*/ "Disconnected",
                connecting: /*[[#{top.connecting}]]*/ "Connecting"
            };

            function setConnectionStatus(state) {
                $("#connectionStatus img").attr("src", connectionImages[state]);
                $("#connectionStatus div").text(connectionTexts[state]);
            }

            function setSideBarVisible(show) {
                showSideBar = show;
                document.body.classList.toggle("shell-sidebar-hidden", !show);
                $("#sideBarToggle").attr("aria-expanded", String(show));
            }

            // on narrow screens the left region is a drawer that does not change the sidebar setting
            var narrow = window.matchMedia("(max-width: 760px)");

            function setDrawerOpen(open) {
                document.body.classList.toggle("shell-drawer-open", open);
                $("#sideBarToggle").attr("aria-expanded", String(open));
            }

            function toggleSideBar() {
                if (narrow.matches) {
                    setDrawerOpen(!document.body.classList.contains("shell-drawer-open"));
                    return;
                }
                setSideBarVisible(!showSideBar);
                StompClient.send("/app/settings/sidebar", showSideBar);
            }

            // the drawer closes once a page is shown, and when the screen gets wide again
            page.listen(document.querySelector('[data-shell-region="main"]'), "shell:load", () => setDrawerOpen(false));
            page.listen(narrow, "change", () => {
                setDrawerOpen(false);
                $("#sideBarToggle").attr("aria-expanded", String(!narrow.matches && showSideBar));
            });
            Page.actions({closeDrawer: () => setDrawerOpen(false)});

            function executeInstantSearch() {
                var query = $("#query").val().trim();
                if (query.length > 1 && query != previousQuery) {
                    previousQuery = query;
                    document.searchForm.requestSubmit();
                }
            }

            page.actions({
                toggleSideBar: toggleSideBar,
                toggleConnection() {
                    setConnectionStatus("connecting");
                    if (StompClient.state == "connected") {
                        StompClient.disconnect();
                    } else if (StompClient.state == "dc") {
                        StompClient.connect();
                    }
                },
                selectQuery(input) {
                    input.select();
                },
                instantSearch() {
                    page.clearTimer(instantSearchTimeout);
                    instantSearchTimeout = page.setTimeout(executeInstantSearch, 300);
                },
                logout() {
                    document.getElementById("logoutForm").submit();
                }
            });

            page.subscribe({
                "/user/queue/settings/sidebar": msg => {
                    var show = JSON.parse(msg.body);
                    if (showSideBar != show) {
                        setSideBarVisible(show);
                    }
                }
            });
            StompClient.onConnect.push(() => setConnectionStatus("connected"));
            StompClient.onDisconnect.push(() => setConnectionStatus("disconnected"));
            StompClient.onConnecting.push(() => setConnectionStatus("connecting"));
            if (StompClient.state == "connected") {
                setConnectionStatus("connected");
            }
            if (narrow.matches) {
                $("#sideBarToggle").attr("aria-expanded", "false");
            }

            // used by the keyboard shortcuts
            window.TopNav = {toggleSideBar: toggleSideBar};
        });
    </script>

    <nav class="shell-topbar">
        <button type="button" id="sideBarToggle" class="shell-icon-button" data-on-click="toggleSideBar"
                th:attr="aria-expanded=${model.showSideBar}" aria-controls="shell-left" th:title="#{more.keyboard.sidebar}">
            <img th:src="${themes?.get('sidebarImage') ?: 'icons/default_light/sidebar.svg'}" alt="">
        </button>

        <a class="shell-nav-item" th:href="@{/home}" target="main">
            <img th:src="${themes?.get('homeImage') ?: 'icons/default_light/home.svg'}" alt="">
            <span class="topHeader" th:utext="#{top.home}">Home</span>
        </a>
        <a class="shell-nav-item" th:href="@{/nowPlaying}" target="main">
            <img th:src="${themes?.get('nowPlayingImage') ?: 'icons/default_light/now_playing.svg'}" alt="">
            <span class="topHeader" th:utext="#{top.now_playing}">Now Playing</span>
        </a>
        <a class="shell-nav-item" th:href="@{/starred}" target="main">
            <img th:src="${themes?.get('starredImage') ?: 'icons/default_light/starred.svg'}" alt="">
            <span class="topHeader" th:utext="#{top.starred}">Starred</span>
        </a>
        <a class="shell-nav-item" th:href="@{/playlists}" target="main">
            <img th:src="${themes?.get('playlistImage') ?: 'icons/default_light/playlist.svg'}" alt="">
            <span class="topHeader" th:utext="#{left.playlists}">Playlists</span>
        </a>
        <a class="shell-nav-item" th:href="@{/podcastChannels}" target="main">
            <img th:src="${themes?.get('podcastLargeImage') ?: 'icons/default_light/podcast.svg'}" alt="">
            <span class="topHeader" th:utext="#{top.podcast}">Podcast</span>
        </a>
        <a class="shell-nav-item" th:href="@{/bookmarks}" target="main">
            <img th:src="${themes?.get('bookmarkImage') ?: 'icons/default_light/bookmark.svg'}" alt="">
            <span class="topHeader" th:utext="#{top.bookmarks}">Bookmarks</span>
        </a>
        <a class="shell-nav-item" th:if="${model.user.settingsRole}" th:href="@{/settings}" target="main">
            <img th:src="${themes?.get('settingsImage') ?: 'icons/default_light/settings.svg'}" alt="">
            <span class="topHeader" th:utext="#{top.settings}">Settings</span>
        </a>
        <a class="shell-nav-item" th:href="@{/status}" target="main">
            <img th:src="${themes?.get('statusImage') ?: 'icons/default_light/status.svg'}" alt="">
            <span class="topHeader" th:utext="#{top.status}">Status</span>
        </a>
        <a class="shell-nav-item" th:href="@{/more}" target="main">
            <img th:src="${themes?.get('moreImage') ?: 'icons/default_light/more.svg'}" alt="">
            <span class="topHeader" th:utext="#{top.more}">More</span>
        </a>
        <a class="shell-nav-item" th:href="@{/help}" target="main">
            <img th:src="${themes?.get('helpImage') ?: 'icons/default_light/help.svg'}" alt="">
            <span class="topHeader" th:utext="#{top.help}">Help</span>
        </a>

        <form class="shell-search" method="post" th:action="@{/search}" target="main" name="searchForm" role="search">
            <label for="query" class="shell-visually-hidden" th:text="#{top.search}">Search</label>
            <input required type="search" name="query" id="query" size="28" th:placeholder="#{top.search}"
                   data-on-click="selectQuery" data-on-input="instantSearch">
            <button type="submit" class="shell-icon-button" th:title="#{top.search}">
                <img th:src="${themes?.get('searchImage') ?: 'icons/default_light/search.svg'}" th:alt="#{top.search}">
            </button>
        </form>

        <div class="shell-topbar-end">
            <a class="shell-nav-item" th:href="@{/personalSettings}" target="main">
                <img th:if="${model.showAvatar}" th:src="@{/avatar(username=${model.user.username})}" th:alt="#{status.user}" width="30" height="30">
                <img th:unless="${model.showAvatar}" th:src="${themes?.get('userImage') ?: 'icons/default_light/user.svg'}" th:alt="#{status.user}">
                <span class="topHeader" th:text="${model.user.username}"></span>
            </a>
            <button type="button" id="connectionStatus" class="shell-nav-item shell-nav-button" data-on-click="toggleConnection">
                <img th:src="${themes?.get('disconnectedImage') ?: 'icons/default_light/disconnected.svg'}" alt="">
                <div class="detail" th:utext="#{top.disconnected}">Disconnected</div>
            </button>
            <button type="button" class="shell-nav-item shell-nav-button" data-on-click="logout">
                <img th:src="${themes?.get('logoutImage') ?: 'icons/default_light/logout.svg'}" alt="">
                <div class="detail" th:utext="#{top.logout}">Logout</div>
            </button>
        </div>
    </nav>
    <form id="logoutForm" th:action="@{/logout}" method="POST" target="_top" hidden></form>
</th:block>
</body>
</html>
