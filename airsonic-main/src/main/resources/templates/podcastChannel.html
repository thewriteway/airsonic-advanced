<html><head>
    <th:block th:replace="~{head :: common_head}" />
    <th:block th:replace="~{jquery}" />
    <th:block th:replace="~{table}" />
    <script type="text/javascript" th:src="@{/script/utils.js}"></script>
    <script type="text/javascript" th:inline="javascript">
        Page.define("podcastChannel", function (page) {
            var deleteUrl = /*[[@{/podcastReceiverAdmin.view(channelId=${command.channel.id}, deleteChannel=${command.channel.id})}]]*/ "";
            var refreshUrl = /*[[@{/podcastReceiverAdmin.view(refresh,channelId=${command.channel.id})}]]*/ "";
            var confirmDelete = /*[[#{podcastreceiver.confirmdelete}]]*/ "";

            function countSelected() {
                var count = $('.music tr input[type="checkbox"]:checked').length;
                $('#episode-control .selected-action').toggle(count > 0);
            }

            page.actions({
                playChannel(link) {
                    top.playQueue.onPlayPodcastChannel(link.dataset.id);
                },
                deleteChannel() {
                    Page.confirm(confirmDelete).then(ok => {
                        if (ok) {
                            Page.navigate(deleteUrl);
                        }
                    });
                },
                refreshChannels() {
                    Page.navigate(refreshUrl);
                },
                selectAllEpisodes(checkbox) {
                    $('.music tr input[type="checkbox"]').prop('checked', checkbox.checked);
                    countSelected();
                },
                countSelected: countSelected
            });

            countSelected();
        });
    </script>
    <style type="text/css">
      .music .center {
          text-align: center;
      }
      .music .left {
          text-align: left;
      }
      #episode-control td{
          height: 28px;
          vertical-align: middle;
          padding: 0 0.5em;
      }
      #episode-control td.selected-action{
          display: none;
      }
      .paging {
          text-align: right;
          margin: 15px 0;
          font-size: 1rem;
          list-style-type: none;
      }
      
      .paging li {
          display: inline-block;
      }
      
      .paging.current, .paging a {
          padding: 0 3px;
      }
      
      .paging a {
          display: block;
      }
    </style>
</head>
<body class="mainframe bgcolor1" data-page="podcastChannel">

<div style="float:left;margin-right:1.5em;margin-bottom:1em">
    <th:block th:replace="~{coverArt::art(podcastChannelId=${command.channel.id}, coverArtSize=${160})}" />
</div>

<h1 id="name"><a th:href="@{/podcastChannels.view}" th:text="#{podcastreceiver.title}"></a> &raquo; <span th:text="${command.channel.title}"></span></h1>
<h2>
    <span class="header"><a href="#" data-on-click="playChannel" th:data-id="${command.channel.id}" th:text="#{common.play}"></a></span>

    <th:block th:if="${command.user.podcastRole}">
        | <span class="header"><a href="#" data-on-click="deleteChannel" th:text="#{common.delete}"></a></span>
        | <span class="header"><a href="#" data-on-click="refreshChannels" th:text="#{podcastreceiver.check}"></a></span>
    </th:block>
    <th:block th:if="*{user.adminRole}">
        | <span class="header"><a th:href="@{/podcastSettings.view}" th:text="#{podcastreceiver.settings}"></a></span>
    </th:block>
</h2>

<div class="detail" style="padding-top:0.2em;white-space:normal;width:80%" th:text="${command.channel.description}"></div>

<div class="detail" style="padding-top:1.0em">
    <span th:text="#{podcastreceiver.episodes(${#lists.size(command.episodes)})}"></span> &ndash;
    <span th:text="#{podcastreceiver.status.__${#strings.toLowerCase(command.channel.status)}__}"></span>
    <span th:if="${command.channel.status.name eq 'ERROR'}" class="warning" th:text="${command.channel.errorMessage}"></span>
</div>

<div style="height:0.7em;clear:both"></div>

<hr/>
<form th:action="@{/podcastChannel.view}" method="post" id="form-selected">
<input type="hidden" id="channelId" name="channelId" th:value="${command.channel.id}"/>
<input type="hidden" id="page" name="page" th:value="${pages.number}"/>
<input type="hidden" id="size" name="size" th:value="${pages.size}"/>
<table id="episode-control"><tr>
    <td style="padding-left:1em"><span><a th:href="@{podcastChannel.view(id=${command.channel.id}, page=${pages.number}, size=${pages.size})}"><i data-icon="refresh-cw" role="img" th:aria-label="#{podcastreceiver.refresh}"
                        th:title="#{podcastreceiver.refresh}"></i></a></span></td>
    <th:block th:if="${command.user.podcastRole}">
        <td class="selected-action"><button type="submit" class="icon-button" name="download" form="form-selected" th:title="#{podcastreceiver.downloadselected}"><i data-icon="cloud-download" role="img" th:aria-label="#{podcastreceiver.downloadselected}"></i></button></td>
        <td class="selected-action"><button type="submit" class="icon-button" name="delete" form="form-selected" th:title="#{podcastreceiver.deleteselected}"><i data-icon="trash-2" role="img" th:aria-label="#{podcastreceiver.deleteselected}"></i></button></td>
        <td class="selected-action"><button type="submit" class="icon-button" name="lock" form="form-selected" th:title="#{podcastreceiver.lockselected}"><i data-icon="lock" role="img" th:aria-label="#{podcastreceiver.lockselected}"></i></button></td>
        <td class="selected-action"><button type="submit" class="icon-button" name="unlock" form="form-selected" th:title="#{podcastreceiver.unlockselected}"><i data-icon="lock-open" role="img" th:aria-label="#{podcastreceiver.unlockselected}"></i></button></td>
    </th:block>
</tr></table>


</form>

<div class="dataTables_wrapper">
    <div name="table_length" th:if="${pages.totalPages gt 1}" class="dataTables_length">
        <label>Show </label>
        <select name="table_length" aria-controls="table" class="custom-select custom-select-sm form-control form-control-sm" data-on-change="navigateToValue">
            <option th:each="size: ${ {5, 10, 25, 50, 100} }" th:value="@{/podcastChannel.view(page=0, id=${command.channel.id}, size=${size})}" th:selected="${pages.size eq size}" th:text="${size}"></option>
        </select>
        <label> entities</label>
    </div>
    <div class="pagination" id="podcastEpisodesPagination" th:if="${pages.totalPages > 1}">
        <ul class="paging">
            <li>
                <span th:if="${pages.first}" th:text="#{common.previous}"></span>
                <a th:if="${not pages.first}"
                    th:href="@{/podcastChannel.view(page=${pages.number - 1}, id=${command.channel.id}, size=${pages.size})}" th:text="#{common.previous}"></a>
            </li>
            <!-- first page-->
            <li th:if="${pages.number gt 2}">
                <a th:href="@{/podcastChannel.view(page=0, id=${command.channel.id}, size=${pages.size})}">1</a>
            </li>

            <!-- ... -->
            <li th:if="${pages.number gt 3}">
                <span>...</span>
            </li>

            <th:block th:each="i : ${ #numbers.sequence(pages.number - 2, pages.number + 2) }">
                <li th:if="${i ge 0 and i lt pages.totalPages}">
                    <span th:if="${i eq pages.number}" th:text="${i + 1}"></span>
                    <a th:if="${i ne pages.number}"
                        th:href="@{/podcastChannel.view(page=${i}, id=${command.channel.id}, size=${pages.size})}" th:text="${i + 1}"></a>
                </li>
            </th:block>

            <!-- ... -->
            <li th:if="${pages.number lt pages.totalPages - 4}">
                <span>...</span>
            </li>

            <!-- last page -->
            <li th:if="${pages.number lt pages.totalPages - 3}">
                <a th:href="@{/podcastChannel.view(page=${pages.totalPages - 1}, id=${command.channel.id}, size=${pages.size})}"
                    th:text="${pages.totalPages}"></a>
            </li>

            <!-- next -->
            <li>
                <span th:if="${pages.last}" th:text="#{common.next}"></span>
                <a th:if="${not pages.last}"
                    th:href="@{/podcastChannel.view(page=${pages.number + 1}, id=${command.channel.id}, size=${pages.size})}" th:text="#{common.next}">
                </a>
            </li>

        </ul>
    </div>
</div>
<table class="music">
        <tr>
            <th class="fit center"><input type="checkbox" id="episodessa" value="all" data-on-change="selectAllEpisodes" aria-label="all"/></th>
            <th colspan="6"></th>
            <th class="truncate left" th:text="#{podcastreceiver.episode}"></th>
            <th class="fit center" th:text="#{personalsettings.duration}"></th>
            <th class="fit left" th:text="#{podcastreceiver.published}"></th>
            <th class="fit center" th:text="#{top.status}"></th>
            <th class="truncate left" th:text="#{sharesettings.description}"></th>
        </tr>
        <tr th:each="episode: ${command.episodes}">
            <input type="hidden" th:field="${command.episodes[__${episodeStat.index}__].id}" form="form-selected"/>
            <input type="hidden" th:field="${command.episodes[__${episodeStat.index}__].status}" form="form-selected"/>

            <td class="fit center"><input type="checkbox" th:field="${command.episodes[__${episodeStat.index}__].selected}" form="form-selected" data-on-change="countSelected"/></td>

            <th:block th:if="${#strings.isEmpty(episode.mediaFile?.id) or episode.status.name ne 'COMPLETED'}">
                <td colspan="4"></td>
            </th:block>
            <th:block th:if="${!#strings.isEmpty(episode.mediaFile?.id) && episode.status.name eq 'COMPLETED'}">
                    <th:block th:replace="~{playButtons::buttons(
                        id=${episode.mediaFile.id},
                        playEnabled=${command.user.streamRole and !command.partyModeEnabled },
                        addEnabled=${command.user.streamRole and !command.partyModeEnabled },
                        asTable=true,
                        podcastId=${episode.id}
                    )}" />
            </th:block>
            <td colspan="2" th:unless="${command.user.podcastRole}"></td>
            <!--/* An empty form (forms cannot wrap table cells): its fields refer to it with the form attribute. */-->
            <form th:if="${command.user.podcastRole}" th:id="|formEpisode${episode.id}|" th:action="@{/podcastEpisodes}" method="post"></form>
            <th:block th:if="${command.user.podcastRole}" th:with="formId=|formEpisode${episode.id}|">
                <input type="hidden" name="episodeId" th:value="${episode.id}" th:form="${formId}"/>
                <input type="hidden" name="page" th:value="${pages.number}" th:form="${formId}"/>
                <input type="hidden" name="size" th:value="${pages.size}" th:form="${formId}"/>
                <td class="fit center">
                    <button th:if="${episode.locked}" type="submit" class="icon-button" name="unlock" th:form="${formId}" th:title="#{podcastreceiver.locked}">
                        <i data-icon="lock" role="img" th:aria-label="#{podcastreceiver.locked}" class="icon-sm"></i>
                    </button>
                    <button th:if="${!episode.locked && #lists.contains({'COMPLETED', 'SKIPPED', 'NEW'}, episode.status.name)}" type="submit" class="icon-button" name="lock" th:form="${formId}" th:title="#{podcastreceiver.unlocked}">
                        <i data-icon="lock-open" role="img" th:aria-label="#{podcastreceiver.unlocked}" class="icon-sm icon-weak"></i>
                    </button>
                </td>
                <td class="fit center" th:if="${#lists.contains({'COMPLETED', 'DELETED'}, episode.status.name)}">
                    <button type="submit" class="icon-button" name="init" th:form="${formId}" th:title="#{podcastreceiver.reset}">
                        <i data-icon="rotate-ccw" role="img" th:aria-label="#{podcastreceiver.reset}" class="icon-sm"></i>
                    </button>
                </td>
                <td class="fit center" th:if="${#lists.contains({'SKIPPED', 'NEW', 'ERROR'}, episode.status.name)}">
                    <button type="submit" class="icon-button" name="download" th:form="${formId}" th:title="#{common.download}">
                        <i data-icon="cloud-download" role="img" th:aria-label="#{common.download}" class="icon-sm"></i>
                    </button>
                </td>
                <td th:if="${'DOWNLOADING' eq episode.status.name}"></td>
            </th:block>
            <td class="truncate">
                    <span th:title="${episode.title}" class="songTitle" th:text="${episode.title}"></span>
            </td>

            <td class="fit center">
                <span class="detail" th:text="${episode.duration}"></span>
            </td>

            <td class="fit left">
                <span class="detail" th:text="${#temporals.format(episode.publishDate, 'MEDIUM')}"></span>
            </td>

            <td class="fit center">
                <span class="detail">
                        <span th:if="${episode.status.name eq 'DOWNLOADING' && episode.completionRate != null }" th:text="${#numbers.formatPercent(episode.completionRate, 1 ,1)}">
                        </span>
                        <span th:unless="${episode.status.name eq 'DOWNLOADING' && episode.completionRate != null}" th:text="#{podcastreceiver.status.__${#strings.toLowerCase(episode.status)}__}">
                        </span>
                </span>
            </td>

            <td class="truncate">
                <span th:if="${episode.status.name eq 'ERROR'}" class="detail warning" th:title="${episode.errorMessage}"
                    th:text="${episode.errorMessage}"></span>
                <span th:if="${episode.status.name ne 'ERROR'}" class="detail" th:title="${episode.description}"
                    th:text="${episode.description}"></span>
            </td>

        </tr>
</table>
<div class="pagination" id="podcastEpisodesPagination" th:if="${pages.totalPages > 1}">
    <ul class="paging">
        <li>
            <span th:if="${pages.first}" th:text="#{common.previous}"></span>
            <a th:if="${not pages.first}"
                th:href="@{/podcastChannel.view(page=${pages.number - 1}, id=${command.channel.id}, size=${pages.size})}" th:text="#{common.previous}"></a>
        </li>
        <!-- first page-->
        <li th:if="${pages.number gt 2}">
            <a th:href="@{/podcastChannel.view(page=0, id=${command.channel.id}, size=${pages.size})}">1</a>
        </li>

        <!-- ... -->
        <li th:if="${pages.number gt 3}">
            <span>...</span>
        </li>

        <th:block th:each="i : ${ #numbers.sequence(pages.number - 2, pages.number + 2) }">
            <li th:if="${i ge 0 and i lt pages.totalPages}">
                <span th:if="${i eq pages.number}" th:text="${i + 1}"></span>
                <a th:if="${i ne pages.number}"
                    th:href="@{/podcastChannel.view(page=${i}, id=${command.channel.id}, size=${pages.size})}" th:text="${i + 1}"></a>
            </li>
        </th:block>

        <!-- ... -->
        <li th:if="${pages.number lt pages.totalPages - 4}">
            <span>...</span>
        </li>

        <!-- last page -->
        <li th:if="${pages.number lt pages.totalPages - 3}">
            <a th:href="@{/podcastChannel.view(page=${pages.totalPages - 1}, id=${command.channel.id}, size=${pages.size})}"
                th:text="${pages.totalPages}"></a>
        </li>

        <!-- next -->
        <li>
            <span th:if="${pages.last}" th:text="#{common.next}"></span>
            <a th:if="${not pages.last}"
                th:href="@{/podcastChannel.view(page=${pages.number + 1}, id=${command.channel.id}, size=${pages.size})}" th:text="#{common.next}">
            </a>
        </li>

    </ul>
</div>


</body></html>
