<!DOCTYPE html>
<html><head>
    <th:block th:replace="~{head :: common_head}" />
    <th:block th:replace="~{jquery}" />
    <th:block th:replace="~{websocket}" />
    <title th:text="#{lyrics.title}"></title>

    <script type="text/javascript" th:inline="javascript">
        // independent page (a popup window), with a websocket connection of its own
        Page.define("lyrics", function (page) {
            var hasLyrics = /*[[${view.lyrics != null}]]*/ false;
            var mediaFileId = /*[[${view.id}]]*/ 0;

            function getLyrics(artist, song) {
                $("#wait").css("display", "inline");
                $("#lyrics").css("display", "none");
                $("#noLyricsFound").css("display", "none");
                $("#tryLater").css("display", "none");
                StompClient.send("/app/lyrics/get", JSON.stringify({artist: artist, song: song, id: mediaFileId}));
            }

            function getLyricsCallback(lyricsInfo) {
                $("#wait").css("display", "none");
                if (lyricsInfo.persisted === true) {
                    location.reload();
                    return;
                }
                if (lyricsInfo.tryLater) {
                    $("#tryLater").css("display", "inline");
                } else {
                    $("#noLyricsFound").css("display", "inline");
                }
                if (hasLyrics) {
                    $("#lyrics").css("display", "inline");
                }
            }

            page.actions({
                search() {
                    getLyrics($('#artist').val(), $('#song').val());
                    return false;
                }
            });

            page.subscribe({
                "/user/queue/lyrics/get": msg => getLyricsCallback(JSON.parse(msg.body))
            }, function () {
                if (hasLyrics) {
                    $("#wait").css("display", "none");
                    $("#lyrics").css("display", "inline");
                    $("#noLyricsFound").css("display", "none");
                } else {
                    getLyrics(/*[[${view.artist}]]*/ "", /*[[${view.song}]]*/ "");
                }
            });
        });
    </script>

</head>
<body class="mainframe bgcolor1" data-page="lyrics">

<form action="#" data-on-submit="search">
    <table>
        <tr>
            <td th:text="#{lyrics.artist}"></td>
            <td style="padding-left:0.50em"><input id="artist" type="text" size="40" th:value="${view.artist}"/></td>
            <td style="padding-left:0.75em"><input type="submit" th:value="#{lyrics.search}" style="width:6em"/></td>
        </tr>
        <tr>
            <td th:text="#{lyrics.song}"></td>
            <td style="padding-left:0.50em"><input id="song" type="text" size="40" th:value="${view.song}"/></td>
            <td style="padding-left:0.75em">
                <button type="button" data-on-click="navigate" th:data-href="@{/lyrics/edit(id=${view.id})}"
                        style="width:6em; display:inline-block; text-align:center;" th:text="#{common.edit}">
                </button>
            </td>
        </tr>
    </table>
</form>
<hr/>
<h2 id="wait" th:text="#{lyrics.wait}"></h2>
<h2 id="noLyricsFound" style="display:none" th:text="#{lyrics.nolyricsfound}"></h2>
<p id="tryLater" style="display:none"><b th:text="#{lyrics.trylater}"></b></p>

<div id="lyrics" style="display:none;">
    <h2 id="lyricsHeader" style="text-align:center;margin-bottom:1em"
        th:text="${(#strings.isEmpty(view.artist) ? '' : view.artist + ' - ') + #strings.defaultString(view.song, '')}"></h2>
    <div id="lyricsText">
        <th:block th:if="${view.lyrics}">
            <th:block th:each="str, stat : ${view.lyrics.split('\r\n|\r|\n', -1)}">
                <th:block th:text="${str}"/>
                <br th:if="${!stat.last}"/>
            </th:block>
        </th:block>
    </div>

    <p class="detail" style="text-align:right" th:text="${'lyrics from ' + view.source}">
    </p>
</div>

<hr/>
<p style="text-align:center">
    <a href="#" data-on-click="closeWindow">[<span th:text="#{common.close}"></span>]</a>
</p>

</body>
</html>
